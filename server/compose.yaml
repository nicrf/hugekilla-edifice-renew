# edifice-lobby with Docker Compose:
#   cp .env.example .env   (then edit it)
#   docker compose pull && docker compose up -d
services:
  lobby:
    # prebuilt by GitHub Actions (amd64 and arm64); "docker compose build" rebuilds it locally
    # EDIFICE_LOBBY_TAG in .env pins a release (e.g. 0.5.4, or 0.5 for its fixes);
    # latest follows main
    image: ghcr.io/nicrf/edifice-lobby:${EDIFICE_LOBBY_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      EDIFICE_PUBLIC_HOST: ${EDIFICE_PUBLIC_HOST:?set EDIFICE_PUBLIC_HOST in .env}
      EDIFICE_TURN_RELAY_IP: ${EDIFICE_TURN_RELAY_IP:-}
      EDIFICE_TURN_RELAY_PORTS: ${EDIFICE_TURN_RELAY_PORTS:-49160-49200}
      EDIFICE_TURN_SECRET: ${EDIFICE_TURN_SECRET:?set EDIFICE_TURN_SECRET in .env}
      EDIFICE_TRUST_PROXY: ${EDIFICE_TRUST_PROXY:-0}
      EDIFICE_TRUSTED_PROXIES: ${EDIFICE_TRUSTED_PROXIES:-}
      EDIFICE_PUBLIC_URL: ${EDIFICE_PUBLIC_URL:-}
      EDIFICE_SIGNAL: ${EDIFICE_SIGNAL:-:10000}
      # origins of the web version (CORS), comma-separated; add a custom domain here
      EDIFICE_CORS_ORIGINS: ${EDIFICE_CORS_ORIGINS:-https://nicrf.github.io}
    ports:
      # HTTP API and the WebSocket signaling relay (GET /v1/signal): put a TLS
      # reverse proxy in front (Caddy's reverse_proxy passes WebSockets as is)
      - "8080:8080/tcp"
      # signaling over plain TCP, for older games: remove it (and EDIFICE_SIGNAL=off)
      # once every player has a game that uses the WebSocket relay
      - "10000:10000/tcp"
      - "3478:3478/udp"            # STUN/TURN
      - "49160-49200:49160-49200/udp"   # TURN relayed traffic, same range as EDIFICE_TURN_RELAY_PORTS
    healthcheck:
      test: ["CMD", "/edifice-lobby", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The dedicated game server (server/edifice-server.Dockerfile), optional: not started
  # by a plain "docker compose up", only with its profile:
  #   docker compose --profile game pull && docker compose --profile game up -d
  # Host networking: the game's UDP port (EDIFICE_GAME_PORT) and the players' own ports
  # after it (one each with plain UDP) are the server's own, GameNetworkingSockets and
  # WebRTC find its public address for P2P, and the lobby sees the game come from the
  # server's public IP (through a bridge network it would see a private one, and refuse
  # it). Open EDIFICE_GAME_PORT up to EDIFICE_GAME_PORT+33 in UDP in the firewall.
  # The console: docker attach <container> (detach with Ctrl-P Ctrl-Q).
  game:
    profiles: ["game"]
    image: ghcr.io/nicrf/edifice-server:${EDIFICE_SERVER_TAG:-latest}
    build:
      context: ..
      dockerfile: server/edifice-server.Dockerfile
    restart: unless-stopped
    network_mode: host
    stdin_open: true
    stop_grace_period: 15s   # SIGTERM: the players are told, the game leaves the lobby
    environment:
      HK_PORT: ${EDIFICE_GAME_PORT:-27020}
      HK_SERVER_NAME: ${EDIFICE_GAME_NAME:-Edifice dedicated server}
      HK_MAX_PLAYERS: ${EDIFICE_GAME_MAX_PLAYERS:-16}
      # public (listed), friends or private (joined by the game code in the log), lan
      HK_VISIBILITY: ${EDIFICE_GAME_VISIBILITY:-public}
      # the lobby's public HTTPS address (never http://lobby:8080: the lobby must see
      # the server's public IP)
      HK_LOBBY: ${EDIFICE_GAME_LOBBY:-https://edifice.rousseaufournier.com}
      HK_MODE: ${EDIFICE_GAME_MODE:-ctf}
      HK_MAP: ${EDIFICE_GAME_MAP:-}
      HK_CONSOLE_RUN: ${EDIFICE_GAME_EXEC:-}
    volumes:
      - game-data:/var/lib/edifice   # net.ini, sv.ini, maps/
    healthcheck:
      test: ["CMD", "/opt/edifice/edifice-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  game-data:
