//use this file to edit your control settings

//this reverses the Y-Axis of the mouse.

mousereverse=0

//these are the four player motion settings:

forward=w
back=s
lstrafe=a
rstrafe=d

//not all of these controls actually do anything
//these are extra controls in the game:

zoom=q
fire=lbutton
build=b
buy=g
showscores=tab
jump=space
talk=y
talkteam=u
reload=r
secondfire=f
jetpack=rbutton
screenshot=c
claim=v
duck=shift
hangglide=rbutton
seemoney=tab
//hold to talk to the players near you (voice chat)
pushtotalk=t

//gamepad (Options > Gamepad): the button of each action, SDL's names
//(a b x y back start leftstick rightstick leftshoulder rightshoulder
//dpup dpdown dpleft dpright lefttrigger righttrigger), empty: none.
//The left stick walks, the right one looks.
pad_fire=righttrigger
pad_jetpack=lefttrigger
pad_jump=a
pad_claim=b
pad_reload=x
pad_build=y
pad_weapnext=rightshoulder
pad_weapprev=leftshoulder
pad_zoom=rightstick
pad_hangglide=
pad_scores=back
pad_talk=dpup
pad_talkteam=dpleft
pad_pushtotalk=dpdown
pad_menu=start
//look speed, dead zone (0..1 of the stick), response curve (1 linear)
pad_sensitivity=1
pad_deadzone=0.18
pad_curve=1.6
pad_invert=0
pad_rumble=1
//touch screens: on-screen controls at the first touch (1), always (2), never (0); size in %
touchcontrols=1
touchsize=100

//these are your video resolution settings.
//set changeres to 1 if you want edifice to start in
//full screen (non windowed) mode, and specify
//the resolution you want in this case.
//press F6 in the game if you want to switch modes

changeres=0
screenwidth=1024
screenheight=768
screendepth=16