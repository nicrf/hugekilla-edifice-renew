//use this file to edit your control settings

//this reverses the Y-Axis of the mouse.

mousereverse=0

//these are the four player motion settings:

forward=w
back=s
lstrafe=a
rstrafe=d

//not all of these controls actually do anything
//these are extra controls in the game:

zoom=q
fire=lbutton
build=b
buy=g
showscores=tab
jump=space
talk=y
talkteam=u
reload=r
secondfire=f
jetpack=rbutton
screenshot=c
claim=v
duck=shift
hangglide=rbutton
seemoney=tab
//hold to talk to the players near you (voice chat)
pushtotalk=t

//these are your video resolution settings.
//set changeres to 1 if you want edifice to start in
//full screen (non windowed) mode, and specify
//the resolution you want in this case.
//press F6 in the game if you want to switch modes

changeres=0
screenwidth=1024
screenheight=768
screendepth=16