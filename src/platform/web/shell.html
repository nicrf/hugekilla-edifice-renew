<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- phones: no pinch zoom, the whole screen (under a notch too) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Edifice</title>
<style>
	/* the game fills the page: SDL follows the canvas' CSS size (resizable window) */
	html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
	body { color: #ccc; font: 15px/1.4 system-ui, sans-serif; }
	/* fingers are the game's (touch controls): no scrolling, zooming or text selection */
	html, body, #canvas { touch-action: none; -webkit-user-select: none; user-select: none;
		-webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
	#canvas { display: block; width: 100vw; height: 100vh; outline: none; }
	/* touch screens: a fullscreen button (top middle, under the life bar, clear of the game's buttons) and,
	   held upright, a hint to turn the device */
	#fullscreen { position: fixed; top: calc(6vh + 6px); left: 50%; transform: translateX(-50%); display: none;
		padding: 6px 14px; border: 1px solid rgba(255,255,255,.45); border-radius: 16px;
		background: rgba(0,0,0,.35); color: #eee; font: 13px system-ui, sans-serif; }
	#rotate { position: fixed; left: 0; right: 0; bottom: 0; display: none; padding: 10px; text-align: center;
		background: rgba(0,0,0,.6); color: #fff; pointer-events: none; }
	body.touch #fullscreen.can { display: block; }
	body.touch.fullscreen #fullscreen { display: none; }
	@media (orientation: portrait) { body.touch #rotate { display: block; } }
	#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
		text-align: center; padding: 16px; pointer-events: none; }
	#status.hidden { display: none; }
	#status a { color: #8cf; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading Edifice&hellip;</div>
<button id="fullscreen" type="button">Full screen</button>
<div id="rotate">Turn your device sideways to play</div>
<script>
	var statusBox = document.getElementById('status');
	function showStatus(html) {
		statusBox.innerHTML = html;
		statusBox.classList.toggle('hidden', !html);
	}
	var Module = {
		canvas: document.getElementById('canvas'),
		// "Downloading data... (1234/5678)" while data/ comes in, "" once running
		setStatus: function (text) {
			var m = /\((\d+)\/(\d+)\)/.exec(text || '');
			showStatus(m ? 'Loading Edifice&hellip; ' + Math.floor(m[1] * 100 / m[2]) + '%' :
				text ? text.replace(/&/g, '&amp;').replace(/</g, '&lt;') : '');
		},
		onQuit: function () {
			showStatus('Edifice has quit. <a href="">Play again</a>');
		},
		onAbort: function () {
			showStatus('Edifice stopped on an error (see the browser console). <a href="">Reload</a>');
		}
	};
	if (!document.createElement('canvas').getContext('webgl2'))
		showStatus('Edifice needs WebGL 2, which this browser does not offer.');

	// browsers keep audio suspended until the player clicks or types (SDL's audio
	// context is Module.SDL2.audioContext)
	function resumeAudio() {
		var ctx = Module.SDL2 && Module.SDL2.audioContext;
		if (ctx && ctx.state === 'suspended') ctx.resume();
	}
	addEventListener('pointerdown', resumeAudio, true);
	addEventListener('keydown', resumeAudio, true);
	Module.canvas.addEventListener('pointerdown', function () { Module.canvas.focus(); });

	// touch screens: the button and the hint above show from the first touch (the
	// game shows its touch controls then too)
	addEventListener('touchstart', function () { document.body.classList.add('touch'); }, {capture: true, passive: true});
	var fsButton = document.getElementById('fullscreen');
	var root = document.documentElement;
	if (root.requestFullscreen || root.webkitRequestFullscreen) fsButton.classList.add('can');
	fsButton.addEventListener('click', function () {
		var p = root.requestFullscreen ? root.requestFullscreen() : root.webkitRequestFullscreen();
		// then landscape, where the browser allows it (Android); not an error elsewhere
		Promise.resolve(p).then(function () {
			if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
		}).catch(function () {});
	});
	function fullscreenChanged() {
		document.body.classList.toggle('fullscreen', !!(document.fullscreenElement || document.webkitFullscreenElement));
	}
	document.addEventListener('fullscreenchange', fullscreenChanged);
	document.addEventListener('webkitfullscreenchange', fullscreenChanged);
</script>
{{{ SCRIPT }}}
</body>
</html>
