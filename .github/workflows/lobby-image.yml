# Builds the edifice-lobby container (server/) and publishes it to the GitHub
# container registry: ghcr.io/<owner>/edifice-lobby
#  - push to main touching server/: tag "latest" (+ "sha-<commit>")
#  - tag v1.2.3: tags "1.2.3" and "1.2"
#  - pull request touching server/: built, not pushed
name: Lobby server image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['server/**', '.github/workflows/lobby-image.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/lobby-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # no QEMU: the Dockerfile cross-compiles with Go for each platform
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/edifice-lobby
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=edifice-lobby
            org.opencontainers.image.description=Edifice game list, P2P signaling and STUN/TURN relay
            org.opencontainers.image.licenses=MIT

      - name: Build (and push outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # what GET /v1/version and -version report: the release (1.2.3) or the branch (main)
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
