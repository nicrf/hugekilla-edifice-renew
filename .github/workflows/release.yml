# Builds Edifice on macOS, Linux and Windows.
#  - push to main / pull request: build check, archives kept as workflow artifacts
#  - tag v* (git tag v0.2.0 && git push origin v0.2.0): build + GitHub release with the 3 archives
#    (only the 3 builds: the network tests and fuzzing already ran on the PR / main)
#  - fuzzing: on main, every Monday, or by hand (Actions > Run workflow), not on PRs
name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04      # older glibc: the binary runs on more distributions
            name: linux
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(Edifice VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project(Edifice VERSION $version) in CMakeLists.txt"
            exit 1
          fi

      - name: Install build tools (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja

      - name: Install build tools (Linux)
        if: matrix.name == 'linux'
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev

      - name: Build and package
        shell: bash
        env:
          # macOS: one universal binary for Intel and Apple Silicon
          EDIFICE_CMAKE_ARGS: ${{ matrix.name == 'macos' && '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13' || '' }}
        run: python build.py --config Release --package

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build/${{ matrix.name }}-release -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: edifice-${{ matrix.name }}
          path: dist/Edifice-*
          if-no-files-found: error

  netplay-tests:
    if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule'"
    # Network tests against a headless server built with AddressSanitizer:
    # version handshake, join bookkeeping, malformed packets (tests/net_*.py).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools, virtual display and software OpenGL
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build xvfb libgl1-mesa-dri libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev

      - name: Build with AddressSanitizer
        env:
          EDIFICE_CMAKE_ARGS: -DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_C_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
        run: python3 build.py --config Debug

      - name: Network tests
        run: tests/run_netplay_tests.sh build/linux-debug/Edifice netplay-logs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: netplay-logs
          path: netplay-logs

  gns:
    # Experimental (roadmap M7): GameNetworkingSockets built through vcpkg, an
    # encrypted loopback connection test, and the game built with EDIFICE_GNS=ON.
    # On Linux, netplay through GameNetworkingSockets (tests/run_gns_netplay_test.sh).
    # Not required for releases yet.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build pkg-config libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev

      - name: Virtual display and software OpenGL (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: .github/scripts/apt-install.sh xvfb libgl1-mesa-dri

      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics; else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: gns-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: gns-${{ matrix.os }}-

      - name: Configure with GameNetworkingSockets
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = Windows ]; then extra="-DVCPKG_TARGET_TRIPLET=x64-windows -A x64"; else extra="-G Ninja"; fi
          cmake -S . -B build/gns $extra -DCMAKE_BUILD_TYPE=Release -DEDIFICE_GNS=ON -DVCPKG_MANIFEST_FEATURES=gns \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build the game and the tests, run the loopback test
        shell: bash
        run: |
          cmake --build build/gns --config Release
          ctest --test-dir build/gns -C Release -R gns_loopback --output-on-failure

      - name: Netplay through GameNetworkingSockets (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: tests/run_gns_netplay_test.sh build/gns/Edifice build/gns/gns_netplay_test gns-logs

      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: gns-netplay-logs
          path: gns-logs
          if-no-files-found: ignore

  fuzzing:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
    # libFuzzer harnesses of every network and file parser (tests/fuzz): seeds
    # first, then about a minute of fuzzing each; any crash fails the job.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and build tools
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh clang cmake ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev

      - name: Build the fuzzers
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DEDIFICE_FUZZ=ON
          grep -q "HK_HAVE_LIBFUZZER:INTERNAL=1" build/fuzz/CMakeCache.txt || { echo "::error::clang has no libFuzzer"; exit 1; }
          cmake --build build/fuzz --target fuzz

      - name: Seed corpora
        run: ctest --test-dir build/fuzz -R '^fuzz_' --output-on-failure

      - name: Fuzz (60 s each)
        run: |
          mkdir -p fuzz-out
          status=0
          names=$(cd build/fuzz && ls fuzz_* | grep -v make_seeds)
          for f in $names; do
            mkdir -p fuzz-out/$f/corpus fuzz-out/$f/crashes
            cp tests/fuzz/corpus/$f/* fuzz-out/$f/corpus/
          done
          printf '%s\n' $names | xargs -P "$(nproc)" -I{} sh -c \
            'build/fuzz/{} -max_total_time=60 -rss_limit_mb=4096 -artifact_prefix=fuzz-out/{}/crashes/ fuzz-out/{}/corpus > fuzz-out/{}.log 2>&1; r=$?; echo "{}: exit $r, $(grep -o "Done [0-9]* runs" fuzz-out/{}.log)"; exit $r' || status=1
          for f in $names; do
            if ls fuzz-out/$f/crashes/* >/dev/null 2>&1; then
              echo "::error::$f crashed"; tail -40 fuzz-out/$f.log; status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-out/*/crashes
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-logs
          path: fuzz-out/*.log
          if-no-files-found: ignore

  lobby-server:
    # server/: game list, signaling and STUN/TURN in Go
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t edifice-lobby .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Builds for macOS (universal), Linux (x86_64) and Windows (x64). No dependency to install.

            - **macOS**: unzip, then right-click `Edifice.app` → Open the first time (the app is not notarized).
            - **Linux**: `tar xzf`, then `./Edifice` (keep the `data/` folder next to it).
            - **Windows**: unzip, then run `Edifice.exe` (SmartScreen may warn: More info → Run anyway).

            Original game by Nelson Planting and John Thomas: https://sourceforge.net/p/hugekilla/code/HEAD/tree/HugeKilla/
