# Builds Edifice on macOS, Linux and Windows.
#  - push to main / pull request: build check, archives kept as workflow artifacts
#  - tag v* (git tag v0.2.0 && git push origin v0.2.0): build + GitHub release with the 3 archives
#    and the web version's zip (only the builds: the network tests and fuzzing already ran on
#    the PR / main), and the web version deployed to GitHub Pages
#  - fuzzing: on main, every Monday, or by hand (Actions > Run workflow), not on PRs
#  - sokol: the renderers (roadmap M13) built and drawn, on every push and PR: sokol_gfx
#    in Debug (validation), and the fixed-function OpenGL backend kept for one release
#  - web: the web version (roadmap M14, Emscripten) built and played in headless
#    Chromium, on every push and PR; at a tag, also deployed to GitHub Pages (job pages)
name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # vcpkg (GameNetworkingSockets, protobuf, OpenSSL), pinned so that releases are
  # reproducible and the binary caches stay valid; bump it to update the ports
  VCPKG_COMMIT: 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
  # Emscripten for the web version (roadmap M14), pinned like vcpkg; build.py --web
  # installs the same one into build/emsdk
  EMSDK_VERSION: '6.0.12'

jobs:
  build:
    # The release archives, built with GameNetworkingSockets (Internet games in
    # P2P, through the lobby's TURN relay when nothing else passes), then unpacked
    # and checked as a player gets them (tests/check_package.py).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04      # older glibc: the binary runs on more distributions
            name: linux
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(Edifice VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project(Edifice VERSION $version) in CMakeLists.txt"
            exit 1
          fi

      - name: Install build tools (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja pkg-config

      - name: Install build tools, virtual display and software OpenGL (Linux)
        if: matrix.name == 'linux'
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build pkg-config libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libcurl4-openssl-dev \
            xvfb libgl1-mesa-dri

      - name: vcpkg
        shell: bash
        run: .github/scripts/vcpkg-setup.sh

      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: vcpkg-cache
          key: vcpkg-release-${{ matrix.name }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}
          restore-keys: vcpkg-release-${{ matrix.name }}-

      - name: Build, unit tests and package
        shell: bash
        # macOS: one universal binary for Intel and Apple Silicon (static vcpkg
        # libraries, cmake/triplets/universal-osx.cmake); Linux: static too;
        # Windows: GameNetworkingSockets and its DLLs + the C++ runtime DLLs.
        # A warning in the game code or its tests fails the build (not in SDL, opus...)
        env:
          EDIFICE_CMAKE_ARGS: -DEDIFICE_WERROR=ON
        run: python build.py --config Release --gns --package --test ${{ matrix.name == 'macos' && '--universal' || '' }}

      # saved right after the build, so that a failing check below keeps it
      - uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: actions/setup-go@v5
        if: matrix.name == 'linux'
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Check the archive (contents, dependencies, a short run)
        shell: bash
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # + HTTPS from the unpacked game to a local lobby over TLS (system
            # libcurl/OpenSSL next to the static OpenSSL of GameNetworkingSockets)
            (cd server && go build -o ../build/edifice-lobby .)
            xvfb-run -a python3 tests/check_package.py dist/Edifice-*-linux.tar.gz --gns --lobby build/edifice-lobby
          else
            python tests/check_package.py dist/Edifice-*.zip --gns
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: edifice-${{ matrix.name }}
          path: dist/Edifice-*
          if-no-files-found: error

  sokol:
    # The sokol_gfx renderer (HK_RENDER_SOKOL, roadmap M13), the releases' since M13.4:
    # a Debug build (sokol_gfx validates every call, and every GL call on Linux)
    # without GameNetworkingSockets, its unit tests, then tests/render_smoke.py draws
    # the menus and a game: Metal on the macOS runner's virtual GPU, D3D11 on Windows
    # (the runner's basic render driver), GL 4.1 core on Linux (Mesa's llvmpipe under
    # Xvfb). The frames are kept as artifacts.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja

      - name: Install build tools, virtual display and software OpenGL (Linux)
        if: matrix.name == 'linux'
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build pkg-config libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libcurl4-openssl-dev \
            xvfb libgl1-mesa-dri

      - name: Build (Debug, sokol_gfx) and unit tests
        shell: bash
        env:
          EDIFICE_CMAKE_ARGS: -DEDIFICE_WERROR=ON
        run: python build.py --config Debug --no-gns --test

      - name: Draw the menus and a game
        shell: bash
        timeout-minutes: 25   # the Ultra scenes are slow on the software renderers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" python3 tests/render_smoke.py build/linux-debug/Edifice --out shots
          elif [ "$RUNNER_OS" = Windows ]; then
            python tests/render_smoke.py build/windows-debug/Debug/Edifice.exe --out shots
          else
            python tests/render_smoke.py build/macos-debug/Edifice.app --out shots
          fi

      # the fixed-function OpenGL backend, selectable for one more release: it still
      # builds, and draws (not on Windows, whose runners only have OpenGL 1.1)
      - name: Build and draw the OpenGL backend (--gl)
        shell: bash
        timeout-minutes: 30
        env:
          EDIFICE_CMAKE_ARGS: -DEDIFICE_WERROR=ON
        run: |
          python build.py --config Release --no-gns --gl
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" python3 tests/render_smoke.py build/linux-release-gl/Edifice --out shots-gl
          elif [ "$RUNNER_OS" = macOS ]; then
            python tests/render_smoke.py build/macos-release-gl/Edifice.app --out shots-gl
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sokol-frames-${{ matrix.name }}
          path: |
            shots
            shots-gl
          if-no-files-found: ignore

  web:
    # The web version (roadmap M14): Emscripten, WebGL2, no threads, solo and offline.
    # Unit tests in Node.js, then tests/web_smoke.py plays it in headless Chromium
    # (SwiftShader's WebGL2): the menu, a solo game, the IndexedDB user folder, and
    # the Internet list from a local lobby on another origin (CORS). The site (as a
    # zip) and the screenshots are kept as artifacts.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install ninja
        timeout-minutes: 20
        run: .github/scripts/apt-install.sh ninja-build

      - name: Build, unit tests and package
        env:
          EDIFICE_CMAKE_ARGS: -DEDIFICE_WERROR=ON
        run: |
          # build.py --web takes emsdk from EMSDK, which setup-emsdk may not export
          [ -n "${EMSDK:-}" ] || export EMSDK=$(cd "$(dirname "$(which emcc)")/../.." && pwd)
          python build.py --web --test --package

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Play it in headless Chromium
        timeout-minutes: 15
        run: |
          (cd server && go build -o ../build/edifice-lobby .)
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium-headless-shell
          python tests/web_smoke.py build/web --out web-shots --lobby build/edifice-lobby

      - uses: actions/upload-artifact@v4
        with:
          name: edifice-web
          path: dist/Edifice-*-web.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: web-shots
          if-no-files-found: ignore

      # a release: the site as GitHub Pages takes it (the job pages deploys it); only
      # the page's four files, not the unit tests built next to them
      - name: Stage the site for GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir site
          cp build/web/index.html build/web/index.js build/web/index.wasm build/web/index.data site/
          ls -l site

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

  fuzzing:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
    # libFuzzer harnesses of every network and file parser (tests/fuzz): seeds
    # first, then about a minute of fuzzing each; any crash fails the job.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and build tools
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh clang cmake ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev

      - name: Build the fuzzers
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DEDIFICE_FUZZ=ON
          grep -q "HK_HAVE_LIBFUZZER:INTERNAL=1" build/fuzz/CMakeCache.txt || { echo "::error::clang has no libFuzzer"; exit 1; }
          cmake --build build/fuzz --target fuzz

      - name: Seed corpora
        run: ctest --test-dir build/fuzz -R '^fuzz_' --output-on-failure

      - name: Fuzz (60 s each)
        run: |
          mkdir -p fuzz-out
          status=0
          names=$(cd build/fuzz && ls fuzz_* | grep -v make_seeds)
          for f in $names; do
            mkdir -p fuzz-out/$f/corpus fuzz-out/$f/crashes
            cp tests/fuzz/corpus/$f/* fuzz-out/$f/corpus/
          done
          printf '%s\n' $names | xargs -P "$(nproc)" -I{} sh -c \
            'build/fuzz/{} -max_total_time=60 -rss_limit_mb=4096 -artifact_prefix=fuzz-out/{}/crashes/ fuzz-out/{}/corpus > fuzz-out/{}.log 2>&1; r=$?; echo "{}: exit $r, $(grep -o "Done [0-9]* runs" fuzz-out/{}.log)"; exit $r' || status=1
          for f in $names; do
            if ls fuzz-out/$f/crashes/* >/dev/null 2>&1; then
              echo "::error::$f crashed"; tail -40 fuzz-out/$f.log; status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-out/*/crashes
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-logs
          path: fuzz-out/*.log
          if-no-files-found: ignore

  lobby-server:
    # server/: game list, signaling and STUN/TURN in Go
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t edifice-lobby .

  pages:
    # The web version on GitHub Pages (https://nicrf.github.io/hugekilla-edifice-renew/),
    # at each release tag. Needs Settings > Pages > Source: GitHub Actions, and the
    # github-pages environment must let tags v* deploy (BUILD.md, "Version web").
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the archives: edifice-macos, -linux, -windows and -web (not the screenshots)
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: edifice-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Builds for macOS (universal, 10.15+), Linux (x86_64, OpenGL 4.1) and Windows (x64, 10+, Direct3D 11). No dependency to install.
            Rendering goes through sokol_gfx: Metal on macOS, Direct3D 11 on Windows, OpenGL 4.1 core on Linux.
            Internet games (Join → Internet, or a game code) connect peer to peer, encrypted, through the
            lobby's relay when needed: nothing to open on your router.

            - **macOS**: unzip, then right-click `Edifice.app` → Open the first time (the app is not notarized).
            - **Linux**: `tar xzf`, then `./Edifice` (keep the `data/` folder next to it).
            - **Windows**: unzip, then run `Edifice.exe` (SmartScreen may warn: More info → Run anyway).
            - **Web** (solo for now): play at https://nicrf.github.io/hugekilla-edifice-renew/ in a browser with WebGL 2,
              or serve the `-web.zip` from any web server (not from `file://`).

            Original game by Nelson Planting and John Thomas: https://sourceforge.net/p/hugekilla/code/HEAD/tree/HugeKilla/
