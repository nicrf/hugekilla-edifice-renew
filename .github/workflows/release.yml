# Builds Edifice on macOS, Linux and Windows.
#  - push to main / pull request: build check, archives kept as workflow artifacts
#  - tag v* (git tag v0.2.0 && git push origin v0.2.0): build + GitHub release with the 3 archives
#    (only the 3 builds: the network tests and fuzzing already ran on the PR / main)
#  - fuzzing: on main, every Monday, or by hand (Actions > Run workflow), not on PRs
name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # vcpkg (GameNetworkingSockets, protobuf, OpenSSL), pinned so that releases are
  # reproducible and the binary caches stay valid; bump it to update the ports
  VCPKG_COMMIT: 9a5dfef5d1a0438a7d24856a85bd60f309d355e9

jobs:
  build:
    # The release archives, built with GameNetworkingSockets (Internet games in
    # P2P, through the lobby's TURN relay when nothing else passes), then unpacked
    # and checked as a player gets them (tests/check_package.py).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04      # older glibc: the binary runs on more distributions
            name: linux
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^project(Edifice VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project(Edifice VERSION $version) in CMakeLists.txt"
            exit 1
          fi

      - name: Install build tools (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja pkg-config

      - name: Install build tools, virtual display and software OpenGL (Linux)
        if: matrix.name == 'linux'
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build pkg-config libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libcurl4-openssl-dev \
            xvfb libgl1-mesa-dri

      - name: vcpkg
        shell: bash
        run: .github/scripts/vcpkg-setup.sh

      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: vcpkg-cache
          key: vcpkg-release-${{ matrix.name }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}
          restore-keys: vcpkg-release-${{ matrix.name }}-

      - name: Build, unit tests and package
        shell: bash
        # macOS: one universal binary for Intel and Apple Silicon (static vcpkg
        # libraries, cmake/triplets/universal-osx.cmake); Linux: static too;
        # Windows: GameNetworkingSockets and its DLLs + the C++ runtime DLLs
        run: python build.py --config Release --gns --package --test ${{ matrix.name == 'macos' && '--universal' || '' }}

      # saved right after the build, so that a failing check below keeps it
      - uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Check the archive (contents, dependencies, a short run)
        shell: bash
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python3 tests/check_package.py dist/Edifice-*-linux.tar.gz --gns
          else
            python tests/check_package.py dist/Edifice-*.zip --gns
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: edifice-${{ matrix.name }}
          path: dist/Edifice-*
          if-no-files-found: error

  netplay-tests:
    if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule'"
    # Network tests against a headless server built with AddressSanitizer:
    # version handshake, join bookkeeping, malformed packets (tests/net_*.py).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools, virtual display and software OpenGL
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build xvfb libgl1-mesa-dri libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libcurl4-openssl-dev

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Build with AddressSanitizer
        env:
          EDIFICE_CMAKE_ARGS: -DCMAKE_CXX_FLAGS=-fsanitize=address -DCMAKE_C_FLAGS=-fsanitize=address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
        run: python3 build.py --config Debug

      - name: Network tests
        run: tests/run_netplay_tests.sh build/linux-debug/Edifice netplay-logs

      - name: Lobby tests (edifice-lobby, a host announcing, a client joining by game code)
        run: |
          (cd server && go build -o ../build/edifice-lobby .)
          SDL_AUDIODRIVER=dummy xvfb-run -a python3 tests/net_lobby.py build/linux-debug/Edifice \
            build/edifice-lobby build/linux-debug/lobby_test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: netplay-logs
          path: netplay-logs

  gns:
    # GameNetworkingSockets (roadmap M7, in the releases since M7e): an encrypted
    # loopback connection test, and the game built with EDIFICE_GNS=ON.
    # On Linux, netplay through GameNetworkingSockets (tests/run_gns_netplay_test.sh),
    # and Internet games joined P2P through edifice-lobby (tests/net_p2p.py).
    # Not required for releases (the build job checks the archives themselves).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential cmake ninja-build pkg-config libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libcurl4-openssl-dev

      - name: Virtual display and software OpenGL (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: .github/scripts/apt-install.sh xvfb libgl1-mesa-dri

      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: vcpkg
        shell: bash
        run: .github/scripts/vcpkg-setup.sh

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: gns-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: gns-${{ matrix.os }}-

      - name: Configure with GameNetworkingSockets
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = Windows ]; then extra="-DVCPKG_TARGET_TRIPLET=x64-windows -A x64"; else extra="-G Ninja"; fi
          cmake -S . -B build/gns $extra -DCMAKE_BUILD_TYPE=Release -DEDIFICE_GNS=ON -DVCPKG_MANIFEST_FEATURES=gns \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build the game and the tests, run the loopback test
        shell: bash
        run: |
          cmake --build build/gns --config Release
          ctest --test-dir build/gns -C Release -R gns_loopback --output-on-failure

      - name: Netplay through GameNetworkingSockets (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: tests/run_gns_netplay_test.sh build/gns/Edifice build/gns/gns_netplay_test gns-logs

      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: P2P through the lobby, direct then TURN relay only (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          (cd server && go build -o ../build/edifice-lobby .)
          NET_P2P_LOGS=gns-logs/p2p xvfb-run -a python3 tests/net_p2p.py build/gns/Edifice \
            build/edifice-lobby build/gns/gns_p2p_test

      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: gns-netplay-logs
          path: gns-logs
          if-no-files-found: ignore

  fuzzing:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
    # libFuzzer harnesses of every network and file parser (tests/fuzz): seeds
    # first, then about a minute of fuzzing each; any crash fails the job.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and build tools
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh clang cmake ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev

      - name: Build the fuzzers
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DEDIFICE_FUZZ=ON
          grep -q "HK_HAVE_LIBFUZZER:INTERNAL=1" build/fuzz/CMakeCache.txt || { echo "::error::clang has no libFuzzer"; exit 1; }
          cmake --build build/fuzz --target fuzz

      - name: Seed corpora
        run: ctest --test-dir build/fuzz -R '^fuzz_' --output-on-failure

      - name: Fuzz (60 s each)
        run: |
          mkdir -p fuzz-out
          status=0
          names=$(cd build/fuzz && ls fuzz_* | grep -v make_seeds)
          for f in $names; do
            mkdir -p fuzz-out/$f/corpus fuzz-out/$f/crashes
            cp tests/fuzz/corpus/$f/* fuzz-out/$f/corpus/
          done
          printf '%s\n' $names | xargs -P "$(nproc)" -I{} sh -c \
            'build/fuzz/{} -max_total_time=60 -rss_limit_mb=4096 -artifact_prefix=fuzz-out/{}/crashes/ fuzz-out/{}/corpus > fuzz-out/{}.log 2>&1; r=$?; echo "{}: exit $r, $(grep -o "Done [0-9]* runs" fuzz-out/{}.log)"; exit $r' || status=1
          for f in $names; do
            if ls fuzz-out/$f/crashes/* >/dev/null 2>&1; then
              echo "::error::$f crashed"; tail -40 fuzz-out/$f.log; status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-out/*/crashes
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-logs
          path: fuzz-out/*.log
          if-no-files-found: ignore

  lobby-server:
    # server/: game list, signaling and STUN/TURN in Go
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t edifice-lobby .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Builds for macOS (universal, 10.13+), Linux (x86_64) and Windows (x64, 10+). No dependency to install.
            Internet games (Join → Internet, or a game code) connect peer to peer, encrypted, through the
            lobby's relay when needed: nothing to open on your router.

            - **macOS**: unzip, then right-click `Edifice.app` → Open the first time (the app is not notarized).
            - **Linux**: `tar xzf`, then `./Edifice` (keep the `data/` folder next to it).
            - **Windows**: unzip, then run `Edifice.exe` (SmartScreen may warn: More info → Run anyway).

            Original game by Nelson Planting and John Thomas: https://sourceforge.net/p/hugekilla/code/HEAD/tree/HugeKilla/
